
name: Build Uberknall Preamp

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'CMakeLists.txt'
      - 'Source/**'
      - '.github/workflows/build.yml'

jobs:
  build-windows:
    name: Windows VST3 Build
    runs-on: windows-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          path: JUCE

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -DJUCE_DIR="${{ github.workspace }}/JUCE"
          -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3 and Standalone
        run: cmake --build build --config Release --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Uberknall-Preamp-VST3
          path: build/UberknallPreamp_artefacts/Release/VST3/
          if-no-files-found: error

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: Uberknall-Preamp-Standalone
          path: build/UberknallPreamp_artefacts/Release/Standalone/
          if-no-files-found: warn
