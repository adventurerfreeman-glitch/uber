name: Build VST3

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure project
        run: cmake -S . -B build -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target UberknallInspired_VST3

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Uberknall-Inspired-Windows-VST3
          path: build/UberknallInspired_artefacts/Release/VST3
          if-no-files-found: error
